name: Build APK/JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract ZIP
        shell: bash
        run: |
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: ZIP dosyasi bulunamadi!"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

      - name: Find Gradle project
        shell: bash
        run: |
          echo "Gradle projeleri:"
          find source -name "gradlew" -type f -print

          if ! find source -name "gradlew" -type f | grep -q .; then
            echo "HATA: ZIP icinde gradlew bulunamadi!"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        shell: bash
        run: |
          GRADLEW=$(find source -name "gradlew" -type f | head -n 1)
          chmod +x "$GRADLEW"

      - name: Build
        shell: bash
        run: |
          GRADLEW=$(find source -name "gradlew" -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")

          cd "$PROJECT_DIR"

          echo "Project: $(pwd)"
          echo "Java:"
          java -version

          echo "Gradle:"
          ./gradlew --version

          ./gradlew clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: built-jars
          path: |
            source/**/build/libs/*.jar
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apks
          path: |
            source/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
