name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP
        run: |
          mkdir source
          unzip -q *.zip -d source

      - name: Find Gradle project
        run: |
          find source -name gradlew -type f -print

      - name: Make Gradle executable
        run: |
          chmod +x "$(find source -name gradlew -type f | head -1)"

      - name: Build with Gradle
        run: |
          PROJECT_DIR="$(dirname "$(find source -name gradlew -type f | head -1)")"
          cd "$PROJECT_DIR"
          ./gradlew clean build --no-daemon

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            source/**/build/libs/*.jar
            source/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
