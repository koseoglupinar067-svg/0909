name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # Actions sekmesinden elle de çalıştırabilirsin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Projen bir .zip içinde duruyorsa (kaynak kod repoya zip olarak
      # atılmışsa) bu adımın yorumunu kaldır ve dosya adını güncelle:
      # - name: Kaynağı aç
      #   run: unzip -o app-source.zip -d .

      - name: gradlew'a çalıştırma izni ver
        run: chmod +x ./gradlew

      - name: APK build et
        run: ./gradlew assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

